[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
# Internal crates
csvizmo-can = { path = "crates/csvizmo-can" }
csvizmo-csv = { path = "crates/csvizmo-csv" }
csvizmo-stats = { path = "crates/csvizmo-stats" }
csvizmo-utils = { path = "crates/csvizmo-utils" }

# External dependencies
byteorder = "1.5.0"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.4.0"
eyre = "0.6.14"
gnuplot = "0.0.46"
hex = { version = "0.4.3", features = ["serde"] }
itertools = "0.15.0"
itertools-num = "0.1.3"
kernel-density-estimation = "0.2.0"
ordered-float = "5.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Dev dependencies
assert_cmd = { version = "2.2.2", features = ["color-auto"] }
csvizmo-test = { path = "crates/csvizmo-test" }
pretty_assertions = "1.4.1"
